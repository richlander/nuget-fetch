  # ---------------------------------------------------------------------------
  # caching (CT22-CT24)
  # ---------------------------------------------------------------------------
  - name: "CT22: package cache round-trip"
    prompt: |
      This console project references a small NuGet client library (see the .csproj). Using THAT
      library's package cache, first check the cache for "Newtonsoft.Json" 13.0.3 (expect a miss on a
      cold app cache), then download+extract it and store it in the cache, then check again (expect a
      hit). Print two lines:  miss: <True|False>  and  hit: <True|False>
      Use a unique app cache name so the run is reproducible. Build and run to confirm.
    setup:
      files:
        - { path: Fetch.csproj, source: fixtures/ct/CT22/Fetch.csproj }
        - { path: Program.cs, source: fixtures/ct/CT22/Program.cs }
    reject_tools: [web_search, web_fetch]
    assertions:
      - { type: run_command_and_assert, command_to_run: "dotnet", command_arguments: "build", expected_exit_code: 0, command_timeout: 600 }
      - { type: file_contains, path: "Program.cs", value: "PackageCache" }
      - type: run_command_and_assert
        command_to_run: "dotnet"
        command_arguments: "run --no-build"
        expected_exit_code: 0
        expected_std_output_matches: "(?=[\\s\\S]*miss: True)(?=[\\s\\S]*hit: True)"
        command_timeout: 120
    rubric:
      - "Uses PackageCache.TryGet (miss) then PackageCache.Cache after extracting, then TryGet (hit)"
      - "Caches the EXTRACTED directory, not the raw .nupkg"
      - "Builds and prints 'miss: True' and 'hit: True'"
    timeout: 900

