  - name: "CT24: response cache with a freshness window"
    prompt: |
      This console project references a small NuGet client library (see the .csproj). Using THAT
      library's response cache (a fresh, unique app cache name), store a small JSON payload under a
      category+key, then read it back two ways and print:
        1. read with an any-age lookup    ->  fresh: <True|False>
        2. read with a zero max-age window ->  stale: <True|False>   (a zero window must be a miss)
      Build and run to confirm.
    setup:
      files:
        - { path: Fetch.csproj, source: fixtures/ct/CT24/Fetch.csproj }
        - { path: Program.cs, source: fixtures/ct/CT24/Program.cs }
    reject_tools: [web_search, web_fetch]
    assertions:
      - { type: run_command_and_assert, command_to_run: "dotnet", command_arguments: "build", expected_exit_code: 0, command_timeout: 600 }
      - { type: file_contains, path: "Program.cs", value: "ResponseCache" }
      - type: run_command_and_assert
        command_to_run: "dotnet"
        command_arguments: "run --no-build"
        expected_exit_code: 0
        expected_std_output_matches: "(?=[\\s\\S]*fresh: True)(?=[\\s\\S]*stale: True)"
        command_timeout: 120
    rubric:
