  - name: "CT21: three-state signature policy"
    prompt: |
      This console project references a small NuGet client library (see the .csproj). Using THAT
      library, download version 13.0.3 of "Newtonsoft.Json" and verify its signature. Then make a
      trust decision over the THREE possible signature states: reject only when the signature is
      present-but-invalid; accept a valid signature; and treat unsigned as accepted-with-note. Print:
      decision: <accept|reject|accept-unsigned>
      Build and run to confirm.
    setup:
      files:
        - { path: Fetch.csproj, source: fixtures/ct/CT21/Fetch.csproj }
        - { path: Program.cs, source: fixtures/ct/CT21/Program.cs }
